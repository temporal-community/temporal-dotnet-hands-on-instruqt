title: Temporal .NET Hands-On
teaser: Three hands-on C# challenges — durable orchestration, human-in-the-loop approval,
  and the saga pattern.
description: |-
  A hands-on workshop teaching Temporal fundamentals in C# / .NET
  through an auto-loan underwriting domain.

  Three challenges, roughly half a day:

  1. Orchestrate three unreliable service calls as a durable workflow,
     configure a retry policy, and prove durability by killing the
     worker mid-run.
  2. Pause an application for an underwriter using a workflow update,
     expose its state with a query, and escalate a stalled decision.
  3. Unwind committed work with the saga pattern, and learn why
     compensations must be registered first and written idempotently.

  Each challenge builds on the last. Practice and solution projects are
  both in the sandbox — work through the TODOs at your own pace.
